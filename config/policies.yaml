# ============================================================
# FRIDAY :: AUTONOMY POLICIES
# Defines what Friday can do autonomously vs. what requires approval.
# Every action a skill wants to execute is first checked against this policy.
# ============================================================

autonomy_level: "supervised"   # off | supervised | trusted | full
# - off:        Friday only reacts to direct commands. No autonomy loop.
# - supervised: Friday proposes, Bhargav approves via Telegram (DEFAULT for v1.0).
# - trusted:    Friday acts on low/medium risk; asks for HIGH risk.
# - full:       Friday acts on everything except money/prod/public broadcasts.

risk_classes:
  low:
    description: "Read-only or internal side-effects. No external comms, no money, no data loss."
    auto_approve_at: ["supervised", "trusted", "full"]
    examples:
      - "read leads.csv"
      - "run nexus snapshot"
      - "prune old log files"
      - "write to friday memory"
      - "draft content without sending"

  medium:
    description: "Writes to external systems Friday owns, or sends internal (telegram-to-bhargav) messages."
    auto_approve_at: ["trusted", "full"]
    examples:
      - "send telegram to bhargav"
      - "update CRM row"
      - "create calendar event"
      - "schedule reminder"

  high:
    description: "Outbound to third parties, money-adjacent, or content that goes public."
    auto_approve_at: ["full"]
    examples:
      - "send whatsapp to client"
      - "post to linkedin"
      - "send outbound email"
      - "submit form to external site"

  forbidden:
    description: "Never, regardless of autonomy level. Requires explicit typed command from Bhargav."
    auto_approve_at: []
    examples:
      - "execute live trade"
      - "move money"
      - "ship code to prod"
      - "delete memory.json"
      - "rm -rf anything"

# Hard-gated actions — require exact typed confirmation even in full mode
hard_gates:
  - "send money"
  - "execute trade"
  - "deploy to production"
  - "wipe memory"
  - "disable friday"

# Rate limits
rate_limits:
  telegram_pings_per_hour: 6
  outbound_messages_per_day: 30
  skill_invocations_per_hour: 60
  autonomy_ticks_per_hour: 4  # once every 15 min

# Quiet windows — NO autonomous action during these except critical alerts
quiet_windows:
  - name: night_sleep
    start: "23:00"
    end: "05:30"
    allow_critical: true
  - name: day_job
    start: "09:00"
    end: "18:00"
    allow_critical: true
  - name: sunday_full_rest
    day: sunday
    allow_critical: false   # even critical held until Monday 06:00

# What counts as "critical" and can pierce quiet windows
critical_triggers:
  - "daemon crashed"
  - "memory corruption"
  - "api key exposed"
  - "disk >95% full"
  - "trading drawdown >5%"

# Confirmation flow
confirmation:
  channel: telegram
  timeout_minutes: 60
  auto_reject_after_timeout: true
  format: |
    🤖 FRIDAY proposes:
    {proposal}

    Reply:
      ✅ /yes {id}   to approve
      ❌ /no {id}    to reject
      ⏸ /hold {id}  to defer 1h
