# ============================================================
# FRIDAY :: ACTIVE GOALS
# The objectives Friday autonomously works toward.
# Sorted by priority (higher = more urgent). Friday scans this
# file every autonomy tick and picks the highest-priority
# unblocked goal with a due/trigger condition satisfied.
# ============================================================

goals:
  - id: agency_outreach_daily
    title: "Outreach: 10 new leads contacted per active day"
    engine: agency
    priority: 100
    active: true
    frequency: daily
    skip_days: [sunday]
    success_metric: "outreach_today >= 10"
    actions:
      - skill: outreach
        operation: find_due_leads
      - skill: outreach
        operation: draft_next_touch
      - skill: content
        operation: queue_for_approval
    trigger:
      type: time_window
      start: "18:00"
      end: "22:00"
    description: |
      The agency needs 10 outreach touches per active day to hit Phase 0 revenue.
      Friday picks due leads from the CRM, drafts personalized next-touch messages,
      and queues them for Bhargav to approve via Telegram before sending.

  - id: morning_briefing_ship
    title: "Ship morning briefing at 06:00"
    engine: all
    priority: 95
    active: true
    frequency: daily
    skip_days: [sunday]
    success_metric: "briefing_sent_today == true"
    actions:
      - skill: briefing
        operation: run_morning
    trigger:
      type: time_window
      start: "06:00"
      end: "06:10"

  - id: evening_debrief_ship
    title: "Ship evening debrief at 22:00"
    engine: all
    priority: 90
    active: true
    frequency: daily
    skip_days: [sunday]
    success_metric: "debrief_sent_today == true"
    actions:
      - skill: briefing
        operation: run_evening
    trigger:
      type: time_window
      start: "22:00"
      end: "22:10"

  - id: self_maintenance
    title: "Keep Friday healthy: prune memory, rotate logs, flush tmp"
    engine: system
    priority: 50
    active: true
    frequency: daily
    success_metric: "last_maintenance_today == true"
    actions:
      - skill: system
        operation: rotate_logs
      - skill: system
        operation: prune_memory
      - skill: system
        operation: health_check
    trigger:
      type: time_window
      start: "03:00"
      end: "03:30"

  - id: drift_detection
    title: "Watch for empire drift (overdue outreach, stalled trading, content gaps)"
    engine: all
    priority: 70
    active: true
    frequency: hourly
    skip_days: []
    success_metric: "no_unflagged_anomalies"
    actions:
      - skill: watchdog
        operation: scan
      - skill: watchdog
        operation: alert_if_critical
    trigger:
      type: interval
      every_minutes: 60

  - id: reflection_nightly
    title: "Reflect on today's actions and update playbook"
    engine: all
    priority: 40
    active: true
    frequency: daily
    success_metric: "reflection_written_today"
    actions:
      - skill: journal
        operation: write_nightly_reflection
    trigger:
      type: time_window
      start: "22:30"
      end: "23:00"

  - id: trading_watch
    title: "Monitor paper portfolio + regime drift"
    engine: trading
    priority: 60
    active: true
    frequency: hourly
    skip_days: []
    success_metric: "trading_state_fresh"
    actions:
      - skill: watchdog
        operation: check_trading
    trigger:
      type: interval
      every_minutes: 120

# Goal that gets injected when Bhargav issues `friday focus <topic>`
ad_hoc_slot:
  id: ad_hoc
  title: ""
  active: false
  priority: 200  # overrides everything
