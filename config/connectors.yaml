    name: Gmail
    category: communications
    status: connected
    auth_state: verified_profile
    risk_tier: high
    phase: now
    solo_friendly: true
    requires_org_workspace: false
    verified_on: "2026-05-12"
    capabilities:
      - search and read inbox
      - read attachments
      - create drafts
      - send emails
      - label archive and trash messages
    friday_use_cases:
