# FRIDAY Connector Command Center
# This is the permissioned map of FRIDAY's external nervous system.
# Status values:
#   connected     - authenticated and recently verified from Codex
#   available     - tool surface is available, but not verified in this repo run
#   action_needed - connector exists but needs reconnect/config
#   missing       - high-value connector not connected yet

connectors:
